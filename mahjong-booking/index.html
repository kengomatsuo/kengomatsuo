<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Landing and booking site for a mahjong parlour. Guests hold a table by the hour, then look the booking up by its reference. By Kenneth Fang."
    />
    <title>Mahjong Booking · Kenneth Fang</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <nav>
      <a href="/" class="nav-logo">MK</a>
      <ul class="nav-links">
        <li><a href="/#client-work">← Work</a></li>
      </ul>
    </nav>

    <main>
      <section id="hero" class="project-hero">
        <div class="hero-inner">
          <div class="card-meta">
            <span class="card-tag">Web</span>
          </div>
          <h1>Mahjong Booking</h1>
          <p class="hero-sub">Landing and booking site for a mahjong parlour. Guests hold a table by the hour, then look the booking up by its reference.</p>
          <ul class="chips">
            <li>Astro</li>
            <li>TypeScript</li>
            <li>Tailwind CSS</li>
            <li>Cal.com</li>
          </ul>
        </div>
      </section>

      <section class="shots-section">
        <div class="shots">
          <figure class="shot">
            <img src="./Preview-1.png" alt="Landing page with a hero photo of a mahjong table and the booking buttons" loading="lazy" />
            <figcaption>Landing page</figcaption>
          </figure>
          <figure class="shot">
            <img src="./Preview-2.png" alt="Landing page showing the three booking steps beside a photo of a game in play" loading="lazy" />
            <figcaption>Booking steps</figcaption>
          </figure>
          <figure class="shot">
            <img src="./Preview-3.png" alt="Booking step one: the regular table and beginners sessions as cards" loading="lazy" />
            <figcaption>Choose a session</figcaption>
          </figure>
          <figure class="shot">
            <img src="./Preview-4.png" alt="Booking step two: the calendar in the venue&#x27;s colours, each hour showing the seats left" loading="lazy" />
            <figcaption>Pick a day and an hour</figcaption>
          </figure>
          <figure class="shot">
            <img src="./Preview-5.png" alt="Check a booking: one field for the reference from the confirmation email" loading="lazy" />
            <figcaption>Look up a booking</figcaption>
          </figure>
        </div>
      </section>
    </main>

    <footer id="contact">
      <div class="footer-inner">
        <span class="footer-name">Kenneth Fang</span>
        <div class="footer-links">
          <a
            href="https://github.com/kengomatsuo"
            target="_blank"
            rel="noopener"
            >GitHub</a
          >
          <a href="mailto:kenneth@matsuokengo.com">Email</a>
        </div>
        <span class="footer-copy">© 2026</span>
      </div>
    </footer>
  </body>
</html>
