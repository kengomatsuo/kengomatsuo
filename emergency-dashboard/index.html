<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Prototype dashboard for Japanese emergency officers to coordinate disaster response on a map, built on mock data. By Kenneth Fang."
    />
    <title>Emergency Dashboard · Kenneth Fang</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <nav>
      <a href="/" class="nav-logo">MK</a>
      <ul class="nav-links">
        <li><a href="/#personal">← Work</a></li>
      </ul>
    </nav>

    <main>
      <section id="hero" class="project-hero">
        <div class="hero-inner">
          <div class="card-meta">
            <span class="card-tag">Web</span>
          </div>
          <h1>Emergency Dashboard</h1>
          <p class="hero-sub">Prototype dashboard for Japanese emergency officers to coordinate disaster response on a map, built on mock data.</p>
          <ul class="chips">
            <li>JavaScript</li>
            <li>MapLibre GL</li>
          </ul>
        </div>
      </section>

      <section class="shots-section">
        <div class="shots">
          <figure class="shot">
            <img src="./Preview-1.png" alt="Earthquake scenario with situation map, shelters, health centres and directive log" loading="lazy" />
          </figure>
          <figure class="shot">
            <img src="./Preview-2.png" alt="Typhoon approach with forecast track and power, water and store status" loading="lazy" />
          </figure>
          <figure class="shot">
            <img src="./Preview-3.png" alt="Tsunami warning with arrival-time zones and an overcrowded health centre flagged" loading="lazy" />
          </figure>
          <figure class="shot">
            <img src="./Preview-4.png" alt="English interface with shelter fill levels on the situation map" loading="lazy" />
          </figure>
        </div>
      </section>
    </main>

    <footer id="contact">
      <div class="footer-inner">
        <span class="footer-name">Kenneth Fang</span>
        <div class="footer-links">
          <a
            href="https://github.com/kengomatsuo"
            target="_blank"
            rel="noopener"
            >GitHub</a
          >
          <a href="mailto:kenneth@matsuokengo.com">Email</a>
        </div>
        <span class="footer-copy">© 2026</span>
      </div>
    </footer>
  </body>
</html>
