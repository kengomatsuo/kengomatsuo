<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

  <body>
    <nav>
      <a href="/" class="nav-logo">MK</a>
      <ul class="nav-links">

      </ul>
    </nav>

    <main>
      <section id="hero" class="project-hero">
        <div class="hero-inner">
          <div class="card-meta">
            <span class="card-tag">Mobile</span>
          </div>
          <h1>Recycling Operations</h1>
          <p class="hero-sub">Paper-to-digital operations for a recycling plant, from material intake through quality control to shipment.</p>

      <section class="shots-section">
        <div class="shots shots--phone">
          <figure class="shot">
            <img src="./Preview-1.png" alt="Recycling operations on a phone: field admin intake screen" loading="lazy" />
            <figcaption>Field intake</figcaption>
          </figure>
          <figure class="shot">
            <img src="./Preview-2.png" alt="Site home with KPI chart and the day&#x27;s outstanding tasks" loading="lazy" />

          </figure>

            <img src="./Preview-3.png" alt="Sampling and quality control screen" loading="lazy" />

          </figure>
        </div>
        <div class="shots">
          <figure class="shot">
            <img src="./Preview-4.png" alt="Office admin dashboard on the web with verified intake over the last seven days and a task queue" loading="lazy" />
            <figcaption>Office dashboard</figcaption>
          </figure>
          <figure class="shot">
            <img src="./Preview-5.png" alt="Arrivals table filtered by status, form and product, each row showing supplier, products and vehicle plate" loading="lazy" />
            <figcaption>Arrivals</figcaption>
          </figure>
          <figure class="shot">
            <img src="./Preview-6.png" alt="Payment receipts by beneficiary with amount and payment status" loading="lazy" />
            <figcaption>Payment receipts</figcaption>
          </figure>

            <figcaption>Suppliers</figcaption>
          </figure>
        </div>
