<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Warehouse app for an online bike-parts seller. Shipping labels become pick lists and every stock change goes into an append-only ledger. By Kenneth Fang."
    />
    <title>Warehouse Ops · Kenneth Fang</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <nav>
      <a href="/" class="nav-logo">MK</a>
      <ul class="nav-links">
        <li><a href="/#client-work">← Work</a></li>
      </ul>
    </nav>

    <main>
      <section id="hero" class="project-hero">
        <div class="hero-inner">
          <div class="card-meta">
            <span class="card-tag">Web</span>
          </div>
          <h1>Warehouse Ops</h1>
          <p class="hero-sub">Warehouse app for an online bike-parts seller. Shipping labels become pick lists and every stock change goes into an append-only ledger.</p>
          <ul class="chips">
            <li>React</li>
            <li>TypeScript</li>
            <li>Supabase</li>
            <li>Tailwind CSS</li>
            <li>Cloudflare</li>
          </ul>
        </div>
      </section>

      <section class="shots-section">
        <div class="shots">
          <figure class="shot">
            <img src="./Preview-1.png" alt="Daily summary with stock movement and stock health charts" loading="lazy" />
            <figcaption>Daily summary</figcaption>
          </figure>
          <figure class="shot">
            <img src="./Preview-2.png" alt="Stock list by SKU with stock value and editable unit price" loading="lazy" />
            <figcaption>Stock ledger</figcaption>
          </figure>
          <figure class="shot">
            <img src="./Preview-3.png" alt="Append-only stock ledger with running balance, reference and operator" loading="lazy" />
            <figcaption>Stock list</figcaption>
          </figure>
          <figure class="shot">
            <img src="./Preview-4.png" alt="Order list parsed from shipping labels with tracking number and ship-by date" loading="lazy" />
            <figcaption>Orders from shipping labels</figcaption>
          </figure>
        </div>
      </section>
    </main>

    <footer id="contact">
      <div class="footer-inner">
        <span class="footer-name">Kenneth Fang</span>
        <div class="footer-links">
          <a
            href="https://github.com/kengomatsuo"
            target="_blank"
            rel="noopener"
            >GitHub</a
          >
          <a href="mailto:kenneth@matsuokengo.com">Email</a>
        </div>
        <span class="footer-copy">© 2026</span>
      </div>
    </footer>
  </body>
</html>
