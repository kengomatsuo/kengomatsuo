<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Internal app where employees browse company events, register to attend and track the ones they joined. By Kenneth Fang."
    />
    <title>Employee Events · Kenneth Fang</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <nav>
      <a href="/" class="nav-logo">MK</a>
      <ul class="nav-links">
        <li><a href="/#client-work">← Work</a></li>
      </ul>
    </nav>

    <main>
      <section id="hero" class="project-hero">
        <div class="hero-inner">
          <div class="card-meta">
            <span class="card-tag">Mobile</span>
          </div>
          <h1>Employee Events</h1>
          <p class="hero-sub">Internal app where employees browse company events, register to attend and track the ones they joined.</p>
          <ul class="chips">
            <li>React Native</li>
            <li>Firebase</li>
          </ul>
        </div>
      </section>

      <section class="shots-section">
        <div class="shots shots--phone">
          <figure class="shot">
            <img src="./Preview-1.png" alt="Home feed listing upcoming company events with date, time and location" loading="lazy" />
            <figcaption>Upcoming events</figcaption>
          </figure>
          <figure class="shot">
            <img src="./Preview-2.png" alt="Personal list of registered events with a countdown to the next one" loading="lazy" />
            <figcaption>My events</figcaption>
          </figure>
        </div>
      </section>
    </main>

    <footer id="contact">
      <div class="footer-inner">
        <span class="footer-name">Kenneth Fang</span>
        <div class="footer-links">
          <a
            href="https://github.com/kengomatsuo"
            target="_blank"
            rel="noopener"
            >GitHub</a
          >
          <a href="mailto:kenneth@matsuokengo.com">Email</a>
        </div>
        <span class="footer-copy">© 2026</span>
      </div>
    </footer>
  </body>
</html>
