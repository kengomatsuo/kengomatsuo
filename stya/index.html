<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="White-label point of sale for restaurants and cafés. One app on phone, tablet and desk, every country and language equal. By Kenneth Fang."
    />
    <title>Stya · Kenneth Fang</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <nav>
      <a href="/" class="nav-logo">MK</a>
      <ul class="nav-links">
        <li><a href="/#personal">← Work</a></li>
      </ul>
    </nav>

    <main>
      <section id="hero" class="project-hero">
        <div class="hero-inner">
          <div class="card-meta">
            <span class="card-tag">POS Platform</span>
          </div>
          <h1>Stya</h1>
          <p class="hero-sub">White-label point of sale for restaurants and cafés. One app on phone, tablet and desk, every country and language equal.</p>
          <ul class="chips">
            <li>Expo</li>
            <li>React Native</li>
            <li>TypeScript</li>
            <li>Supabase</li>
          </ul>
        </div>
      </section>

      <section class="shots-section">
        <div class="shots">
          <figure class="shot">
            <img src="./Preview-1.png" alt="iPad order entry: menu grid and the open ticket for Table 7" loading="lazy" />
          </figure>
          <figure class="shot">
            <img src="./Preview-2.png" alt="Open tickets: table cards with the selected ticket's details" loading="lazy" />
          </figure>
          <figure class="shot">
            <img src="./Preview-3.png" alt="Reports summary: revenue, hourly sales chart, voids and refunds" loading="lazy" />
          </figure>
        </div>
        <div class="shots shots--phone">
          <figure class="shot">
            <img src="./Preview-4.png" alt="iPhone waiter view: sending items to the kitchen for Table 2" loading="lazy" />
          </figure>
        </div>
      </section>
    </main>

    <footer id="contact">
      <div class="footer-inner">
        <span class="footer-name">Kenneth Fang</span>
        <div class="footer-links">
          <a
            href="https://github.com/kengomatsuo"
            target="_blank"
            rel="noopener"
            >GitHub</a
          >
          <a href="mailto:kenneth@matsuokengo.com">Email</a>
        </div>
        <span class="footer-copy">© 2026</span>
      </div>
    </footer>
  </body>
</html>
