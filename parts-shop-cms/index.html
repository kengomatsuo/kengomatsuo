<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Stock, sales, purchases, returns, suppliers and tax reports for a motorcycle parts and service shop. By Kenneth Fang."
    />
    <title>Parts Shop CMS · Kenneth Fang</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <nav>
      <a href="/" class="nav-logo">MK</a>
      <ul class="nav-links">
        <li><a href="/#client-work">← Work</a></li>
      </ul>
    </nav>

    <main>
      <section id="hero" class="project-hero">
        <div class="hero-inner">
          <div class="card-meta">
            <span class="card-tag">Web</span>
          </div>
          <h1>Parts Shop CMS</h1>
          <p class="hero-sub">Stock, sales, purchases, returns, suppliers and tax reports for a motorcycle parts and service shop.</p>
          <ul class="chips">
            <li>Next.js</li>
            <li>TypeScript</li>
            <li>Supabase</li>
            <li>TanStack Query</li>
            <li>PWA</li>
          </ul>
        </div>
      </section>

      <section class="shots-section">
        <div class="shots">
          <figure class="shot">
            <img src="./Preview-1.png" alt="Sales invoice list with customer, salesperson, due date and status" loading="lazy" />
          </figure>
          <figure class="shot">
            <img src="./Preview-2.png" alt="A sales invoice in its printable layout" loading="lazy" />
          </figure>
          <figure class="shot">
            <img src="./Preview-3.png" alt="Stock by SKU with quantity and stock-age buckets" loading="lazy" />
          </figure>
          <figure class="shot">
            <img src="./Preview-4.png" alt="Product catalogue with brand, unit, stock and sale price" loading="lazy" />
          </figure>
        </div>
      </section>
    </main>

    <footer id="contact">
      <div class="footer-inner">
        <span class="footer-name">Kenneth Fang</span>
        <div class="footer-links">
          <a
            href="https://github.com/kengomatsuo"
            target="_blank"
            rel="noopener"
            >GitHub</a
          >
          <a href="mailto:kenneth@matsuokengo.com">Email</a>
        </div>
        <span class="footer-copy">© 2026</span>
      </div>
    </footer>
  </body>
</html>
