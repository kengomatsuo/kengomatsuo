<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ERP for a Mandarin course school: registration, scheduling, payments, attendance, finance reports, report cards and certificates. By Kenneth Fang."
    />
    <title>Course School ERP · Kenneth Fang</title>
    <link rel="stylesheet" href="../style.css" />

    <nav>

    <main>
      <section id="hero" class="project-hero">
        <div class="hero-inner">
          <div class="card-meta">
            <span class="card-tag">Web</span>
          </div>
          <h1>Course School ERP</h1>
          <p class="hero-sub">ERP for a Mandarin course school: registration, scheduling, payments, attendance, finance reports, report cards and certificates.</p>

            <li>TypeScript</li>
