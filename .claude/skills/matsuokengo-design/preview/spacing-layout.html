<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="card.css"></head>
<body><div class="card">
  <div class="col" style="gap:14px">
    <div style="position:relative;height:30px;background:#f7f7f7;border-radius:6px;display:flex;align-items:center;justify-content:center">
      <div style="position:absolute;left:48px;right:48px;top:0;bottom:0;background:#fff;border-left:1px dashed #c9c9c9;border-right:1px dashed #c9c9c9"></div>
      <span style="position:relative;font-size:11px;color:#737373;font-weight:600">content · max-width 960px</span>
    </div>
    <div class="row" style="gap:26px;font-size:12px;color:#737373">
      <span><b style="color:#111">--pad-x</b> &nbsp;clamp(1.25 → 2.5rem)</span>
      <span><b style="color:#111">section</b> &nbsp;clamp(2.5 → 4.5rem)</span>
      <span><b style="color:#111">grid gap</b> &nbsp;1rem</span>
      <span><b style="color:#111">nav</b> &nbsp;54px</span>
    </div>
    <span style="font-size:12px;color:#737373;line-height:1.5">Centered 960px column · fluid padding · auto-fill <span class="mono">minmax(250px,1fr)</span> card grids · alternating section bands for rhythm.</span>
  </div>
</div></body></html>
