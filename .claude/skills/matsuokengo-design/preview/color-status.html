<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="card.css"></head>
<body><div class="card">
  <div class="row" style="align-items:center;gap:28px">
    <div class="col" style="gap:10px">
      <span class="badge">In Progress</span>
      <span class="hex mono" style="font-size:11px;color:#737373">light · #fef3c7 / #92400e</span>
    </div>
    <div class="col" style="gap:10px">
      <span class="badge" style="background:#3b1f00;color:#fcd34d">In Progress</span>
      <span class="hex mono" style="font-size:11px;color:#737373">dark · #3b1f00 / #fcd34d</span>
    </div>
    <div class="col" style="gap:4px;margin-left:auto;max-width:240px;text-align:right">
      <span class="eyebrow">Status amber</span>
      <span style="font-size:12px;color:#737373;line-height:1.5">The only hue outside mono + green. Reserved for unfinished work.</span>
    </div>
  </div>
</div></body></html>
