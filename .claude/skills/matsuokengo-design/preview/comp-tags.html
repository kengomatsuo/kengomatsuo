<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="card.css"></head>
<body><div class="card">
  <div class="row" style="align-items:center;gap:30px">
    <div class="col" style="gap:9px;align-items:flex-start"><span class="tag">Web</span><span class="hex mono">default</span></div>
    <span style="color:#d8d8d8;font-size:20px">→</span>
    <div class="col" style="gap:9px;align-items:flex-start"><span class="tag filled">Web</span><span class="hex mono">on card hover</span></div>
    <div class="col" style="gap:9px;align-items:flex-start;margin-left:20px"><span class="badge">In Progress</span><span class="hex mono">amber badge</span></div>
    <div class="col" style="gap:3px;margin-left:auto;max-width:190px;text-align:right"><span class="eyebrow">Tags &amp; badges</span><span style="font-size:12px;color:#737373;line-height:1.45">Bordered → filled invert over 0.4s.</span></div>
  </div>
</div></body></html>
