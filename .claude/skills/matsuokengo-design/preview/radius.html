<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="card.css"></head>
<body><div class="card">
  <div class="row" style="align-items:flex-end;gap:26px">
    <div class="col" style="gap:8px;align-items:center"><div style="width:110px;height:74px;background:#f0f0f0;border:1px solid #e6e6e6;border-radius:24px"></div><span class="hex mono">24px · cards, buttons</span></div>
    <div class="col" style="gap:8px;align-items:center"><div style="width:74px;height:36px;background:#f0f0f0;border:1px solid #e6e6e6;border-radius:4px"></div><span class="hex mono">4px · tags, badges</span></div>
    <div class="col" style="gap:8px;align-items:center"><div style="width:56px;height:56px;background:#fff;border:1px solid #e6e6e6;border-radius:50%"></div><span class="hex mono">50% · back-to-top</span></div>
    <div class="col" style="gap:3px;margin-left:auto;max-width:200px;text-align:right"><span class="eyebrow">Radius</span><span style="font-size:12px;color:#737373;line-height:1.5">Two radii, nothing between.</span></div>
  </div>
</div></body></html>
