<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="card.css"></head>
<body><div class="card" style="background:#fafafa">
  <div class="row" style="align-items:center;gap:40px;padding:6px 0">
    <div class="col" style="gap:10px;align-items:center"><div style="width:120px;height:72px;background:#fff;border:1px solid #e6e6e6;border-radius:24px"></div><span class="hex mono">at rest · no shadow</span></div>
    <div class="col" style="gap:10px;align-items:center"><div style="width:120px;height:72px;background:#fff;border:1px solid #e6e6e6;border-radius:24px;box-shadow:0 8px 24px rgba(0,0,0,.1);transform:translateY(-6px)"></div><span class="hex mono">hover · 0 8 24 / .10</span></div>
    <div class="col" style="gap:3px;margin-left:auto;max-width:210px;text-align:right"><span class="eyebrow">Elevation</span><span style="font-size:12px;color:#737373;line-height:1.5">Shadows exist only on hover. Soft, low, large-radius. The system leans on borders + whitespace.</span></div>
  </div>
</div></body></html>
