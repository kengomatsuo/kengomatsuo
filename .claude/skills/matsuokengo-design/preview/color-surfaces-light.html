<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="card.css"></head>
<body><div class="card">
  <div class="row">
    <div class="sw"><div class="chip" style="background:#ffffff"></div><div class="lab"><span class="name">Background</span><span class="hex">#ffffff</span></div></div>
    <div class="sw"><div class="chip" style="background:#f7f7f7"></div><div class="lab"><span class="name">Alt band</span><span class="hex">#f7f7f7</span></div></div>
    <div class="sw"><div class="chip" style="background:#f0f0f0"></div><div class="lab"><span class="name">Surface</span><span class="hex">#f0f0f0</span></div></div>
    <div class="sw"><div class="chip" style="background:#d8d8d8"></div><div class="lab"><span class="name">Placeholder</span><span class="hex">#d8d8d8</span></div></div>
    <div class="sw"><div class="chip" style="background:#e6e6e6"></div><div class="lab"><span class="name">Border</span><span class="hex">#e6e6e6</span></div></div>
  </div>
</div></body></html>
