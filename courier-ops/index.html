<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Operations app for a courier company: shipment tracking, delivery status, a finance dashboard and one-tap reports. By Kenneth Fang."
    />
    <title>Courier Operations · Kenneth Fang</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <nav>
      <a href="/" class="nav-logo">MK</a>
      <ul class="nav-links">
        <li><a href="/#client-work">← Work</a></li>
      </ul>
    </nav>

    <main>
      <section id="hero" class="project-hero">
        <div class="hero-inner">
          <div class="card-meta">
            <span class="card-tag">Logistics PWA</span>
          </div>
          <h1>Courier Operations</h1>
          <p class="hero-sub">Operations app for a courier company: shipment tracking, delivery status, a finance dashboard and one-tap reports.</p>
          <ul class="chips">
            <li>React</li>
            <li>TypeScript</li>
            <li>Supabase</li>
            <li>Leaflet</li>
            <li>PWA</li>
          </ul>
        </div>
      </section>

      <section class="shots-section">
        <div class="shots">
          <figure class="shot">
            <img src="./Preview-1.png" alt="Courier operations owner dashboard with revenue, expense and net profit over a thirty-day trend chart" loading="lazy" />
            <figcaption>Owner dashboard</figcaption>
          </figure>
          <figure class="shot">
            <img src="./Preview-2.png" alt="Shipment list showing tracking number, destination, amount and payment state" loading="lazy" />
            <figcaption>Shipments</figcaption>
          </figure>
          <figure class="shot">
            <img src="./Preview-3.png" alt="Reporting screen with Excel and PDF export, revenue by service and shipment status breakdown" loading="lazy" />
            <figcaption>Reports with Excel and PDF export</figcaption>
          </figure>
          <figure class="shot">
            <img src="./Preview-4.png" alt="Shipment detail with status advancement, customer, service and delivery information" loading="lazy" />
            <figcaption>Shipment detail</figcaption>
          </figure>
        </div>
      </section>
    </main>

    <footer id="contact">
      <div class="footer-inner">
        <span class="footer-name">Kenneth Fang</span>
        <div class="footer-links">
          <a
            href="https://github.com/kengomatsuo"
            target="_blank"
            rel="noopener"
            >GitHub</a
          >
          <a href="mailto:kenneth@matsuokengo.com">Email</a>
        </div>
        <span class="footer-copy">© 2026</span>
      </div>
    </footer>
  </body>
</html>
