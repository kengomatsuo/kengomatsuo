<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Safari extension that stops pages taking your click and lists every site they tried to send you to. By Kenneth Fang."
    />
    <title>Undirect · Kenneth Fang</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <nav>
      <a href="/" class="nav-logo">MK</a>
      <ul class="nav-links">
        <li><a href="/#personal">← Work</a></li>
      </ul>
    </nav>

    <main>
      <section id="hero" class="project-hero">
        <div class="hero-inner">
          <div class="card-meta">
            <span class="card-tag">Safari · iOS &amp; macOS</span>
          </div>
          <h1>Undirect</h1>
          <p class="hero-sub">Safari extension that stops pages taking your click and lists every site they tried to send you to.</p>
          <ul class="chips">
            <li>Swift</li>
            <li>SwiftUI</li>
            <li>Safari Web Extension</li>
            <li>JavaScript</li>
          </ul>
          <p class="project-links">
            <a class="card-link" href="https://undirect.matsuokengo.com/" target="_blank" rel="noopener">Website →</a>
            <a class="card-link" href="https://apps.apple.com/app/id6810513194" target="_blank" rel="noopener">App Store →</a>
            <a class="card-link" href="https://github.com/kengomatsuo/undirect" target="_blank" rel="noopener">Source on GitHub →</a>
          </p>
        </div>
      </section>

      <section class="shots-section">
        <div class="shots">
          <figure class="shot">
            <img src="./Preview-1.png" alt="The Undirect popup in Safari on Mac listing the sites a page tried to open" loading="lazy" />
            <figcaption>The popup in Safari on Mac</figcaption>
          </figure>
        </div>
        <div class="shots shots--phone">
          <figure class="shot">
            <img src="./Preview-2.png" alt="The same popup on iPhone" loading="lazy" />
            <figcaption>The popup on iPhone</figcaption>
          </figure>
          <figure class="shot">
            <img src="./Preview-3.png" alt="Turning Undirect on for a site from the Safari page menu on iPhone" loading="lazy" />
            <figcaption>Turning it on for a site</figcaption>
          </figure>
        </div>
        <div class="shots">
          <figure class="shot">
            <img src="./Preview-4.png" alt="The Undirect app on Mac listing every site it blocks" loading="lazy" />
            <figcaption>Every blocked site on Mac</figcaption>
          </figure>
        </div>
      </section>
    </main>

    <footer id="contact">
      <div class="footer-inner">
        <span class="footer-name">Kenneth Fang</span>
        <div class="footer-links">
          <a
            href="https://github.com/kengomatsuo"
            target="_blank"
            rel="noopener"
            >GitHub</a
          >
          <a href="mailto:kenneth@matsuokengo.com">Email</a>
        </div>
        <span class="footer-copy">© 2026</span>
      </div>
    </footer>
  </body>
</html>
