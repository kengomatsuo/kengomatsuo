<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Standings for a mahjong club, entered by staff after each game and open for anyone to read. By Kenneth Fang."
    />
    <title>Club Leaderboard · Kenneth Fang</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <nav>
      <a href="/" class="nav-logo">MK</a>
      <ul class="nav-links">
        <li><a href="/#client-work">← Work</a></li>
      </ul>
    </nav>

    <main>
      <section id="hero" class="project-hero">
        <div class="hero-inner">
          <div class="card-meta">
            <span class="card-tag">Web</span>
          </div>
          <h1>Club Leaderboard</h1>
          <p class="hero-sub">Standings for a mahjong club, entered by staff after each game and open for anyone to read.</p>
          <ul class="chips">
            <li>Bun</li>
            <li>SQLite</li>
            <li>TypeScript</li>
          </ul>
        </div>
      </section>

      <section class="shots-section">
        <div class="shots">
          <figure class="shot">
            <img src="./Preview-1.png" alt="Public season board with the top-three podium and ranked players" loading="lazy" />
          </figure>
          <figure class="shot">
            <img src="./Preview-2.png" alt="Staff screen for recording a game seat by seat" loading="lazy" />
          </figure>
          <figure class="shot">
            <img src="./Preview-3.png" alt="Recent games, season history and the new-season form" loading="lazy" />
          </figure>
        </div>
      </section>
    </main>

    <footer id="contact">
      <div class="footer-inner">
        <span class="footer-name">Kenneth Fang</span>
        <div class="footer-links">
          <a
            href="https://github.com/kengomatsuo"
            target="_blank"
            rel="noopener"
            >GitHub</a
          >
          <a href="mailto:kenneth@matsuokengo.com">Email</a>
        </div>
        <span class="footer-copy">© 2026</span>
      </div>
    </footer>
  </body>
</html>
