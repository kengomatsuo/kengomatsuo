<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Clipboard manager for iPhone, iPad and Mac. Save snippets and images once, paste them into any app. By Kenneth Fang."
    />
    <title>Cutling · Kenneth Fang</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <nav>
      <a href="/" class="nav-logo">MK</a>
      <ul class="nav-links">
        <li><a href="/#personal">← Work</a></li>
      </ul>
    </nav>

    <main>
      <section id="hero" class="project-hero">
        <div class="hero-inner">
          <div class="card-meta">
            <span class="card-tag">iOS &amp; macOS</span>
          </div>
          <h1>Cutling</h1>
          <p class="hero-sub">Clipboard manager for iPhone, iPad and Mac. Save snippets and images once, paste them into any app.</p>
          <ul class="chips">
            <li>Swift</li>
            <li>SwiftUI</li>
            <li>WidgetKit</li>
            <li>iCloud</li>
          </ul>
          <p class="project-links">
            <a class="card-link" href="https://cutling.matsuokengo.com/" target="_blank" rel="noopener">Website →</a>
          </p>
        </div>
      </section>

      <section class="shots-section">
        <div class="shots shots--phone">
          <figure class="shot">
            <img src="./Preview-1.png" alt="Cutling list of saved clipboard entries" loading="lazy" />
            <figcaption>Saved entries</figcaption>
          </figure>
          <figure class="shot">
            <img src="./Preview-2.png" alt="Cutling text entry detail" loading="lazy" />
            <figcaption>Entry detail</figcaption>
          </figure>
          <figure class="shot">
            <img src="./Preview-3.png" alt="Cutling custom keyboard inside another app" loading="lazy" />
            <figcaption>The keyboard in another app</figcaption>
          </figure>
          <figure class="shot">
            <img src="./Preview-4.png" alt="Cutling settings" loading="lazy" />
            <figcaption>Settings</figcaption>
          </figure>
        </div>
      </section>
    </main>

    <footer id="contact">
      <div class="footer-inner">
        <span class="footer-name">Kenneth Fang</span>
        <div class="footer-links">
          <a
            href="https://github.com/kengomatsuo"
            target="_blank"
            rel="noopener"
            >GitHub</a
          >
          <a href="mailto:kenneth@matsuokengo.com">Email</a>
        </div>
        <span class="footer-copy">© 2026</span>
      </div>
    </footer>
  </body>
</html>
